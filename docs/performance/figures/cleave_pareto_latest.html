<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans, system-ui, sans-serif);
  color: var(--foreground, #e2e8f0);
  padding: 0;
  margin: 0;
}
.wrap { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--border, #334155);
  background: var(--secondary, #1e293b);
  color: var(--foreground, #e2e8f0);
  border-radius: var(--radius, 6px);
  padding: 4px 9px;
  font-size: 11px;
  cursor: pointer;
}
.btn.active {
  background: var(--primary, #3b82f6);
  color: var(--primary-foreground, #ffffff);
  border-color: var(--primary, #3b82f6);
  font-weight: 600;
}
.card {
  background: var(--card, #111827);
  border: 1px solid var(--border, #334155);
  border-radius: var(--radius, 8px);
  padding: 16px;
}
.legend {
  display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 6px; font-size: 10.5px; color: var(--muted-foreground, #cbd5e1);
}
.lg-item { display: inline-flex; align-items: center; gap: 4px; }
.swatch { width: 14px; height: 3px; display: inline-block; border-radius: 2px; }
.info-bar {
  font-family: var(--font-mono, monospace);
  font-size: 10.5px;
  color: var(--muted-foreground, #94a3b8);
  padding: 5px 8px;
  background: var(--muted, #0f172a);
  border-radius: var(--radius, 6px);
  margin-top: 6px;
  min-height: 24px;
}
svg { width: 100%; height: auto; display: block; }
.grid { stroke: var(--border, #334155); stroke-opacity: 0.45; stroke-width: 0.8; }
.ax-lbl { fill: var(--muted-foreground, #94a3b8); font-size: 9.2px; }
.ax-title { fill: var(--foreground, #e2e8f0); font-size: 9.8px; font-weight: 700; }
.pt-lbl { fill: var(--foreground, #e2e8f0); font-size: 8.2px; font-weight: 600; paint-order: stroke; stroke: var(--card, #111827); stroke-width: 2.6px; stroke-linejoin: round; }
.pt-sg { fill: #7c3aed; }
.pt-ours { fill: #059669; }
.pt-ec { fill: #0d9488; }
</style>
</head>

const svg = document.getElementById("chart");

function el(tag, attrs, txt) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  if (txt !== undefined) n.textContent = txt;
  return n;
}

function drawPanel(ox, oy, pw, ph, spec) {
  const {x0, x1, y0, y1, xTicks, yTicks, xFmt, yFmt, logX, title, xLabel, yLabel, shade} = spec;
  const sx = v => ox + ((logX ? (Math.log10(v) - Math.log10(x0)) / (Math.log10(x1) - Math.log10(x0)) : (v - x0) / (x1 - x0))) * pw;
  const sy = v => oy + ph - ((v - y0) / (y1 - y0)) * ph;

  if (shade) {
    const xA = Math.max(ox, sx(shade[0])), xB = Math.min(ox + pw, sx(shade[1]));
    svg.appendChild(el("rect", {x: xA, y: oy, width: Math.max(0, xB - xA), height: ph, fill: shade[2], opacity: 0.08}));
  }
  svg.appendChild(el("rect", {x: ox, y: oy, width: pw, height: ph, fill: "none", stroke: "var(--border, #334155)"}));
  svg.appendChild(el("text", {x: ox + pw / 2, y: oy - 6, "text-anchor": "middle", class: "ax-title"}, title));

  for (const t of xTicks) {
    const px = sx(t);
    svg.appendChild(el("line", {x1: px, y1: oy, x2: px, y2: oy + ph, class: "grid"}));
    svg.appendChild(el("text", {x: px, y: oy + ph + 12, "text-anchor": "middle", class: "ax-lbl"}, xFmt ? xFmt(t) : t.toFixed(1)));
  }
  for (const t of yTicks) {
    const py = sy(t);
    svg.appendChild(el("line", {x1: ox, y1: py, x2: ox + pw, y2: py, class: "grid"}));
    svg.appendChild(el("text", {x: ox - 4, y: py + 3, "text-anchor": "end", class: "ax-lbl"}, yFmt ? yFmt(t) : t.toFixed(2)));
  }
  svg.appendChild(el("text", {x: ox + pw / 2, y: oy + ph + 26, "text-anchor": "middle", class: "ax-lbl"}, xLabel));
  svg.appendChild(el("text", {x: ox - 30, y: oy + ph / 2, "text-anchor": "middle", class: "ax-lbl", transform: `rotate(-90 ${ox - 30} ${oy + ph / 2})`}, yLabel));
  return {sx, sy, ox, oy, pw, ph};
}

function starPoints(cx, cy, rOut, rIn) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? rOut : rIn;
    const ang = -Math.PI / 2 + (i * Math.PI) / 5;
    pts.push(`${(cx + r * Math.cos(ang)).toFixed(1)},${(cy + r * Math.sin(ang)).toFixed(1)}`);
  }
  return pts.join(" ");
}

function triPoints(cx, cy, r) {
  return `${cx.toFixed(1)},${(cy - r).toFixed(1)} ${(cx - r * 0.9).toFixed(1)},${(cy + r * 0.75).toFixed(1)} ${(cx + r * 0.9).toFixed(1)},${(cy + r * 0.75).toFixed(1)}`;
}

function drawV36ECore(panel) {
  for (const [key, color, label] of [["v36_ref_ecore", "#3b82f6", "Open-Ref E"], ["v36_dual", "#f43f5e", "Open-Ref E+P"], ["v36_ecore_ablation", "#f43f5e", "E+P ablation"]]) {
    const points = (DATA[key] || []).filter(point => !panel.isSpeed || point.speed_measured);
    if (!points.length) continue;
    const xKey = panel.xKey || "dc", yKey = panel.yKey;
    if (!panel.isSpeed && key !== "v36_ecore_ablation") {
      svg.appendChild(el("path", {d: points.map((point, index) => `${index ? "L" : "M"}${panel.sx(point[xKey])},${panel.sy(point[yKey])}`).join(" "), fill: "none", stroke: color, "stroke-width": 1.8, "stroke-dasharray": "2,2"}));
    }
    for (const point of points) {
      const cx = panel.sx(point[xKey]), cy = panel.sy(point[yKey]);
      const mark = key === "v36_ecore_ablation"
        ? el("path", {d: `M${cx-4},${cy-4}l8,8m-8,0l8,-8`, stroke: color, "stroke-width": 1.6})
        : el("rect", {x: cx-3.5, y: cy-3.5, width: 7, height: 7, fill: color, stroke: "var(--foreground)", "stroke-width": 0.6});
      mark.onmouseenter = () => { info.textContent = `[${label}] ${point.knob} C=${point.dc.toFixed(4)} S=${point.ds.toFixed(4)} Top1=${point.t1.toFixed(2)}% LPIPS=${point.lpips.toFixed(4)}`; };
      svg.appendChild(mark);
    }
  }
}

    "spd": {"StyleGallery": [6, 2, "start"], "StyleShot": [6, 2, "start"], "StyleID": [6, 2, "start"], "Qwen-Img-2.1T": [6, -4, "start"], "Seedream 4.5": [6, 7, "start"], "StyTr2": [6, -1, "start"], "AesPA-Net": [6, 3, "start"], "SaMAM": [-6, -1, "end"], "CUT": [-6, 5, "end"], "Hist2Style": [-6, -3, "end"]},
  };

  for (const sp of panels) {
    const p = drawPanel(sp.ox, sp.oy, sp.pw, sp.ph, sp);
    const {sx, sy} = p;
    const {xKey, yKey} = sp;
    const offMap = sp.isSpeed ? extOffs.spd : extOffs[yKey];

    drawV36ECore({...sp, ...p});

    // External frontier dashed
    svg.appendChild(el("path", {d: sp.extFront.map((b, i) => `${i ? "L" : "M"}${sx(b[xKey]).toFixed(1)},${sy(b[yKey]).toFixed(1)}`).join(" "), fill: "none", stroke: "#64748b", "stroke-width": 1.5, "stroke-dasharray": "4,3", opacity: 0.88}));

    // Prominent External Baselines (original colors)
    for (const b of DATA.external) {
      const cx = sx(b[xKey]), cy = sy(b[yKey]);
      let mark;
      if (b.short === "StyleGallery") {
        mark = el("polygon", {points: starPoints(cx, cy, 7.2, 3.2), fill: "#7c3aed", stroke: "#ffffff", "stroke-width": 0.9});
      } else if (b.tier === "heavy") {
        mark = el("polygon", {points: triPoints(cx, cy, 4.8), fill: "#8b5cf6", stroke: "#ffffff", "stroke-width": 0.75});
      } else {
        mark = el("rect", {x: cx - 3.9, y: cy - 3.9, width: 7.8, height: 7.8, fill: "#0284c7", stroke: "#ffffff", "stroke-width": 0.75});
      }
      mark.onmouseenter = () => { info.textContent = `[External · ${b.tier}] ${b.name} | C=${b.dc.toFixed(4)} S=${b.ds.toFixed(4)} Top1=${b.t1.toFixed(2)}% Speed=${b.ips} img/s`; };
      svg.appendChild(mark);
      const showLbl = !sp.isSpeed || ["StyleGallery", "StyleShot", "StyleID", "StyTr2", "Seedream 4.5", "AesPA-Net", "Hist2Style"].includes(b.short);
      if (showLbl && offMap && offMap[b.short]) {
        const [dx, dy, anc] = offMap[b.short];
        const cls = b.short === "StyleGallery" ? "pt-lbl pt-sg" : "pt-lbl";
        svg.appendChild(el("text", {x: cx + dx, y: cy + dy, "text-anchor": anc, class: cls}, b.short));
      }
    }

    // Combined Ours Pareto Envelope
    if (sp.oursFront && sp.oursFront.length) {
      const fd = sp.oursFront.map((d, i) => `${i ? "L" : "M"}${sx(d[xKey]).toFixed(1)},${sy(d[yKey]).toFixed(1)}`).join(" ");
      svg.appendChild(el("path", {d: fd, fill: "none", stroke: "#10b981", "stroke-width": 5.0, opacity: 0.22, "stroke-linecap": "round"}));
      svg.appendChild(el("path", {d: fd, fill: "none", stroke: "#064e3b", "stroke-width": 1.6, "stroke-dasharray": "4,3"}));
    }

    // E-Core curve + diamonds
    if (ec.length) {
      if (!sp.isSpeed) {
        svg.appendChild(el("path", {d: ec.map((d, i) => `${i ? "L" : "M"}${sx(d[xKey]).toFixed(1)},${sy(d[yKey]).toFixed(1)}`).join(" "), fill: "none", stroke: "#0d9488", "stroke-width": 2.3}));
      } else {
        svg.appendChild(el("line", {x1: sx(ec[0][xKey]), y1: sy(Math.min(...ec.map(x => x[yKey]))), x2: sx(ec[0][xKey]), y2: sy(Math.max(...ec.map(x => x[yKey]))), stroke: "#0d9488", "stroke-width": 2.3}));
      }
      for (const d of ec) {
        const cx = sx(d[xKey]), cy = sy(d[yKey]);
        const pt = el("rect", {x: cx - 3.5, y: cy - 3.5, width: 7, height: 7, fill: "#0d9488", stroke: "#ffffff", "stroke-width": 0.8, transform: `rotate(45 ${cx} ${cy})`});
        pt.onmouseenter = () => { info.textContent = `[Ours E-Core 1-NFE ${d.knob}] C=${d.dc.toFixed(4)} S=${d.ds.toFixed(4)} Top1=${d.t1.toFixed(2)}% LP=${d.lpips} Same=${d.same}% Speed=${d.ips} img/s`; };
        svg.appendChild(pt);
        if (sp.isSpeed && d.knob === "l100") {
          svg.appendChild(el("text", {x: cx + 6, y: cy - 2, "text-anchor": "start", class: "pt-lbl pt-ec"}, `E 1.00 (${d.t1.toFixed(1)}%)`));
        }
      }
    }

    // P-Core curve + circles
    if (pc.length) {
      if (!sp.isSpeed) {
        svg.appendChild(el("path", {d: pc.map((d, i) => `${i ? "L" : "M"}${sx(d[xKey]).toFixed(1)},${sy(d[yKey]).toFixed(1)}`).join(" "), fill: "none", stroke: "#059669", "stroke-width": 2.7}));
      } else {
        svg.appendChild(el("line", {x1: sx(pc[0][xKey]), y1: sy(Math.min(...pc.map(x => x[yKey]))), x2: sx(pc[0][xKey]), y2: sy(Math.max(...pc.map(x => x[yKey]))), stroke: "#059669", "stroke-width": 2.7}));
      }
      for (const d of pc) {
        const cx = sx(d[xKey]), cy = sy(d[yKey]);
        const dot = el("circle", {cx, cy, r: 4.1, fill: "#10b981", stroke: "#064e3b", "stroke-width": 0.9});
        dot.onmouseenter = () => { info.textContent = `[Ours P-Core Final ${d.knob}] C=${d.dc.toFixed(4)} S=${d.ds.toFixed(4)} Top1=${d.t1.toFixed(2)}% LP=${d.lpips} Same=${d.same}% Speed=${d.ips} img/s (4090)`; };
        svg.appendChild(dot);
        if (!sp.isSpeed && ["s075", "s100", "s150"].includes(d.knob)) {
          const lbl = "s=" + d.knob[1] + "." + d.knob.slice(2);
          let dx = 5, dy = -6, anc = "start";
          if (d.knob === "s150" && yKey === "t1") { dx = 0; dy = 12; anc = "middle"; }
          else if (d.knob === "s100" && yKey === "ds") { dx = -6; dy = 10; anc = "end"; }
          svg.appendChild(el("text", {x: cx + dx, y: cy + dy, "text-anchor": anc, class: "pt-lbl pt-ours"}, lbl));
        } else if (sp.isSpeed && ["s150", "s100"].includes(d.knob)) {
          const lbl = d.knob === "s150" ? `P 1.50 (${d.t1.toFixed(1)}%)` : `s=1.00 (${d.t1.toFixed(1)}%)`;
          svg.appendChild(el("text", {x: cx - 6, y: cy + 3, "text-anchor": "end", class: "pt-lbl pt-ours"}, lbl));
        }
      }
    }

    // V36 CLEAVE-One (Open-Ref Unseen Core-5)
    if (v36.length) {
      if (!sp.isSpeed) {
        svg.appendChild(el("path", {d: v36.map((d, i) => `${i ? "L" : "M"}${sx(d[xKey]).toFixed(1)},${sy(d[yKey]).toFixed(1)}`).join(" "), fill: "none", stroke: "#d97706", "stroke-width": 2.2, "stroke-dasharray": "5,2,1.5,2"}));
      } else {
        svg.appendChild(el("line", {x1: sx(v36[0][xKey]), y1: sy(Math.min(...v36.map(x => x[yKey]))), x2: sx(v36[0][xKey]), y2: sy(Math.max(...v36.map(x => x[yKey]))), stroke: "#d97706", "stroke-width": 2.2, "stroke-dasharray": "5,2,1.5,2"}));
      }
      for (const d of v36) {
        const cx = sx(d[xKey]), cy = sy(d[yKey]);
        const tri = el("polygon", {points: `${cx.toFixed(1)},${(cy + 4.8).toFixed(1)} ${(cx - 4.5).toFixed(1)},${(cy - 3.6).toFixed(1)} ${(cx + 4.5).toFixed(1)},${(cy - 3.6).toFixed(1)}`, fill: "#f59e0b", stroke: "#78350f", "stroke-width": 0.9});
        tri.onmouseenter = () => { info.textContent = `[V36 CLEAVE-One Open-Ref I2 ${d.knob}] C=${d.dc.toFixed(4)} S=${d.ds.toFixed(4)} Top1=${d.t1.toFixed(2)}% Causal=${d.causal >= 0 ? "+" : ""}${d.causal.toFixed(2)}pp Same150=${d.same}% LP=${d.lpips} B1=${d.ips} img/s`; };
        svg.appendChild(tri);
        if (!sp.isSpeed && ["t00", "t50", "t80"].includes(d.knob)) {
          const dx = (yKey === "t1" && d.knob === "t50") ? -5 : 4;
          const dy = yKey === "ds" ? -7 : (d.knob === "t00" ? -8 : (d.knob === "t50" ? -8 : 11));
          const anc = (yKey === "t1" && d.knob === "t50") ? "end" : "start";
          svg.appendChild(el("text", {x: cx + dx, y: cy + dy, "text-anchor": anc, class: "pt-lbl", style: "fill:#f59e0b"}, `τ=${d.tau0.toFixed(2).replace(/0$/, "").replace(/\.$/, "")}`));
        } else if (sp.isSpeed && ["t00", "t50"].includes(d.knob)) {
          svg.appendChild(el("text", {x: cx - 5, y: cy + 3, "text-anchor": "end", class: "pt-lbl", style: "fill:#f59e0b"}, `V36 ${d.knob} (${d.t1.toFixed(1)}%)`));
        }
      }
    }
  }
}

function renderRtx3060() {
  svg.setAttribute("viewBox", "0 0 960 300");
  const r = DATA.rtx3060 || {};
  const sp = r.speeds || {};
  legendEl.innerHTML = `
    <span class="lg-item"><span class="swatch" style="background:#059669"></span><b>V35 4090 Baseline</b></span>
    <span class="lg-item"><span class="swatch" style="background:#64748b;border-top:1.5px dashed #94a3b8"></span>3060 Reference (P B4=${sp.ref_p_b4||3.10} / E B4=${sp.ref_e_b4||6.92} img/s)</span>
    <span class="lg-item"><span class="swatch" style="background:#3b82f6"></span><b>3060 Optimized PyTorch (P B4=${sp.opt_p_b4||5.49} / E B2=${sp.opt_e_b2||12.31} img/s)</b></span>
    <span class="lg-item"><span class="swatch" style="background:#ec4899"></span><b>3060 Fast-5 Euler (P B4=${sp.fast5_p_b4||6.51} img/s, 20 NFE)</b></span>
    <span class="lg-item"><span class="swatch" style="background:#0284c7"></span>External Lightweight</span>
  `;
  const spA = drawPanel(44, 22, 264, 242, {x0: 0.28, x1: 0.90, y0: 0.36, y1: 0.618, xTicks: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9], yTicks: [0.40, 0.45, 0.50, 0.55, 0.60], title: "(a) 3060 Test750 非劣: DINO-C vs DINO-S", xLabel: "DINO-C ↑", yLabel: "DINO-S ↑"});
  const spB = drawPanel(368, 22, 264, 242, {x0: 0.28, x1: 0.90, y0: 0.0, y1: 99.0, xTicks: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9], yTicks: [0, 20, 40, 60, 80], yFmt: v => v + "%", title: "(b) 3060 Test750 非劣: DINO-C vs Top-1", xLabel: "DINO-C ↑", yLabel: "CSD Top-1 (%) ↑"});
  const spC = drawPanel(690, 22, 256, 242, {x0: 0.10, x1: 22.0, y0: 0.0, y1: 99.0, logX: true, xTicks: [0.2, 1, 5, 10, 20], xFmt: v => v < 1 ? v.toFixed(1) : v.toFixed(0), yTicks: [0, 20, 40, 60, 80], yFmt: v => v + "%", title: "(c) 3060 Host E2E 吞吐 vs CSD Top-1", xLabel: "RTX 3060 Host E2E (img/s, log) ↑", yLabel: "CSD Top-1 (%) ↑", shade: [5.0, 22.0, "#3b82f6"]});

  for (const [panel, yK, isSpd] of [[spA, "ds", false], [spB, "t1", false], [spC, "t1", true]]) {
    const xK = isSpd ? "ips" : "dc";
    for (const b of (DATA.external || []).filter(x => x[xK] >= (isSpd ? 0.1 : 0.28))) {
      const cx = panel.sx(b[xK]), cy = panel.sy(b[yK]);
      const mk = el("rect", {x: cx - 3.3, y: cy - 3.3, width: 6.6, height: 6.6, fill: "#0284c7", opacity: 0.72, stroke: "#ffffff", "stroke-width": 0.6});
      mk.onmouseenter = () => { info.textContent = `[External] ${b.name} | C=${b.dc.toFixed(4)} S=${b.ds.toFixed(4)} Top1=${b.t1.toFixed(2)}% Speed=${b.ips} img/s`; };
      svg.appendChild(mk);
      if (isSpd && ["StyleShot", "StyleID", "StyTr2", "AesPA-Net", "Hist2Style"].includes(b.short)) {
        svg.appendChild(el("text", {x: cx + 5, y: cy + 3, "text-anchor": "start", class: "pt-lbl"}, b.short));
      }
    }
    if (!isSpd) {
      const v35 = (DATA.ours_pcore || []);
      svg.appendChild(el("path", {d: v35.map((d, i) => `${i ? "L" : "M"}${panel.sx(d.dc).toFixed(1)},${panel.sy(d[yK]).toFixed(1)}`).join(" "), fill: "none", stroke: "#059669", "stroke-width": 2.0, opacity: 0.55}));
    }
    const groups = [
      ["3060 Reference", (r.ref_p || []).concat(r.ref_e || []), "#94a3b8", "4,3", 4.6],
      ["3060 Optimized", (r.opt_p || []).concat(r.opt_e || []), "#3b82f6", "", 4.2],
      ["3060 Fast-5", (r.fast5_p || []), "#ec4899", "2,2", 3.8],
    ];
    for (const name of ["trt", "encoder", "cfg", "combined"]) {
      const pts = (DATA.distillation || []).filter(p => p.profile === name && (!isSpd || p.ips));
      if (pts.length) groups.push(["3060 " + name, pts, "#a855f7", "3,2", 4]);
    }
    for (const [label, pts, col, dash, rad] of groups) {
      const pPts = pts.filter(x => x.knob.startsWith("s"));
      const ePts = pts.filter(x => x.knob.startsWith("l"));
      for (const seg of [pPts, ePts]) {
        if (!seg.length) continue;
        if (!isSpd) {
          svg.appendChild(el("path", {d: seg.map((d, i) => `${i ? "L" : "M"}${panel.sx(d.dc).toFixed(1)},${panel.sy(d[yK]).toFixed(1)}`).join(" "), fill: "none", stroke: col, "stroke-width": label.includes("Optimized") ? 2.4 : 1.7, ...(dash ? {"stroke-dasharray": dash} : {})}));
        } else {
          svg.appendChild(el("line", {x1: panel.sx(seg[0].ips), y1: panel.sy(Math.min(...seg.map(x => x.t1))), x2: panel.sx(seg[0].ips), y2: panel.sy(Math.max(...seg.map(x => x.t1))), stroke: col, "stroke-width": label.includes("Optimized") ? 2.6 : 1.8, ...(dash ? {"stroke-dasharray": dash} : {})}));
        }
        for (const d of seg) {
          const cx = panel.sx(d[xK]), cy = panel.sy(d[yK]);
          const pt = el("circle", {cx, cy, r: rad, fill: label.includes("Reference") ? "none" : col, stroke: label.includes("Reference") ? col : "#ffffff", "stroke-width": label.includes("Reference") ? 1.8 : 0.8});
          pt.onmouseenter = () => { info.textContent = `[${label} · ${d.hw}] ${d.knob} | C=${d.dc.toFixed(4)} S=${d.ds.toFixed(4)} Top1=${d.t1.toFixed(2)}% LP=${d.lpips} Same=${d.same}% Speed=${d.ips} img/s`; };
          svg.appendChild(pt);
        }
      }
    }
    if (isSpd && (r.ref_p || []).length && (r.opt_p || []).length) {
      const rp = r.ref_p.find(x => x.knob === "s100"), op = r.opt_p.find(x => x.knob === "s100"), fp = (r.fast5_p || []).find(x => x.knob === "s100");
      if (rp && op) {
        svg.appendChild(el("line", {x1: panel.sx(rp.ips), y1: panel.sy(rp.t1), x2: panel.sx(op.ips), y2: panel.sy(op.t1), stroke: "#3b82f6", "stroke-width": 1.3, "stroke-dasharray": "3,2"}));
        svg.appendChild(el("text", {x: panel.sx(op.ips) - 4, y: panel.sy(op.t1) - 10, "text-anchor": "end", class: "pt-lbl", style: "fill:#60a5fa"}, `P Opt ${op.ips.toFixed(2)} (1.77x)`));
      }
      if (fp) {
        svg.appendChild(el("text", {x: panel.sx(fp.ips) + 5, y: panel.sy(fp.t1) + 12, "text-anchor": "start", class: "pt-lbl", style: "fill:#f472b6"}, `Fast-5 ${fp.ips.toFixed(2)}`));
      }
      const re = (r.ref_e || []).find(x => x.knob === "l050"), oe = (r.opt_e || []).find(x => x.knob === "l050");
      if (re && oe) {
        svg.appendChild(el("line", {x1: panel.sx(re.ips), y1: panel.sy(re.t1), x2: panel.sx(oe.ips), y2: panel.sy(oe.t1), stroke: "#06b6d4", "stroke-width": 1.3, "stroke-dasharray": "3,2"}));
        svg.appendChild(el("text", {x: panel.sx(oe.ips) - 3, y: panel.sy(oe.t1) + 14, "text-anchor": "end", class: "pt-lbl", style: "fill:#22d3ee"}, `E Opt ${oe.ips.toFixed(2)} (1.86x)`));
      }
    }
  }
}

function draw() {
  svg.innerHTML = "";
  if (curView === "triptych") renderTriptych();
  else if (curView === "rtx3060") renderRtx3060();
  else if (curView === "v36_one") renderV36One();
  else if (curView === "v36_training") renderV36Training();
  else if (curView === "v35_final") renderV35Final();
  else if (curView === "ablations") renderAblations();
  else renderHoldout();
}

document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-view]").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  curView = b.dataset.view;
  draw();
});
draw();
